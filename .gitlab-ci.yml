# DroidOpsInc/jcode CI
#
# Vendored fork of github.com/1jehuang/jcode (MIT). See DROIDOPS.md.
#
# Pipeline shape:
#   - upstream-sync — daily fast-forward of `master` from upstream/master
#                     (only runs when CI variable UPSTREAM_SYNC=true)
#   - preflight     — cargo fmt + cargo clippy + cargo test (workspace)
#   - build         — cross-compile release binaries for 4 targets via
#                     cargo-zigbuild on a single Linux runner
#   - sbom          — Syft CycloneDX + SPDX SBOM over the cargo workspace
#   - sign          — Notation/AKV detached signature over each binary +
#                     SBOM artifact bundle
#   - publish       — ORAS push of binary tarballs + SBOM + signatures
#                     to harbor.focuscell.org/droidopsinc/jcode
#   - scan          — Trivy filesystem scan-gate over the binary artifact
#                     and SBOM (severity HIGH,CRITICAL)
#   - policy-gate   — OPA Conftest gate over the release manifest
#                     (release-bundle.json) using policy/release.rego
#   - attest        — SLSA-style provenance statement signed via Notation
#   - release-create — GitLab Release with `jcode-{os}-{arch}` assets
#                     (tag-triggered: v*-droidops* or v*-dops*)
#
# Acceptance per DroidOpsInc/jcode#2: a push to master ends green;
# tag pushes build the full asset set; SBOM + Notation signature + Trivy
# report + OPA gate + provenance attestation all attached to the release.

include:
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/preflight.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/policy-gate.yml'
  - project: 'DroidOpsInc/launch-sequence'
    ref: main
    file: '/jobs/release-create.yml'

stages:
  - upstream-sync
  - preflight
  - build
  - sbom
  - sign
  - publish
  - scan
  - policy-gate
  - attest
  - release-create

variables:
  IMAGE_REGISTRY: "harbor.focuscell.org"
  HARBOR_PROJECT: "droidopsinc"
  IMAGE_NAME: "jcode"
  UPSTREAM_URL: "https://github.com/1jehuang/jcode.git"
  UPSTREAM_BRANCH: "master"
  # cargo-zigbuild image — handles all four cross-compile targets from
  # a single Linux runner. Pinned for reproducibility.
  # renovate: datasource=docker depName=ghcr.io/rust-cross/cargo-zigbuild
  RUST_BUILD_IMAGE: "ghcr.io/rust-cross/cargo-zigbuild:0.20.0"
  # renovate: datasource=docker depName=anchore/syft
  SYFT_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/anchore/syft:v1.18.1"
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/aquasec/trivy:0.58.0"
  # renovate: datasource=docker depName=ghcr.io/oras-project/oras
  ORAS_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/oras-project/oras:1.2.0"
  # ci-notation ships notation + AKV plugin pre-configured
  NOTATION_IMAGE: "${IMAGE_REGISTRY}/infra/ci-notation:1.0.0"
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"

# --- preflight: fmt + clippy + test ---
#
# Reuses the launch-sequence preflight scaffolding (.preflight:lint /
# .preflight:test) for the verify_tools contract and the standard MR /
# default-branch rules. Each job overrides PREFLIGHT_IMAGE locally to a
# Rust toolchain image (alpine/k8s ships no cargo).

.rust-preflight:
  variables:
    # renovate: datasource=docker depName=rust
    PREFLIGHT_IMAGE: "${IMAGE_REGISTRY}/dockerhub-proxy/library/rust:1.83-bookworm"
    PREFLIGHT_REQUIRED_TOOLS: "cargo rustc"
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/
    policy: pull-push

fmt:
  extends:
    - .preflight:lint
    - .rust-preflight
  variables:
    PREFLIGHT_COMMANDS: "rustup component add rustfmt && cargo fmt --all -- --check"

clippy:
  extends:
    - .preflight:lint
    - .rust-preflight
  variables:
    PREFLIGHT_COMMANDS: "rustup component add clippy && cargo clippy --workspace --all-targets --locked -- -D warnings"

test:
  extends:
    - .preflight:test
    - .rust-preflight
  variables:
    TEST_COMMANDS: "cargo test --workspace --locked"

# --- build matrix: 4 targets via cargo-zigbuild ---
#
# Single Linux image cross-compiles all four targets. Outputs land in
# dist/jcode-{os}-{arch}{ext} matching upstream's install.sh asset shape
# (DROIDOPS.md / scripts/install.sh).

.build:
  stage: build
  image: ${RUST_BUILD_IMAGE}
  variables:
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    JCODE_RELEASE_BUILD: "1"
  cache:
    key:
      prefix: "build-${TARGET}"
      files:
        - Cargo.lock
    paths:
      - .cargo-home/registry/index/
      - .cargo-home/registry/cache/
      - .cargo-home/git/db/
      - target/${TARGET}/release/
    policy: pull-push
  before_script:
    - rustup target add "${TARGET}"
  script:
    - echo "=== cargo-zigbuild --target ${TARGET} ==="
    - export JCODE_BUILD_SEMVER="${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - cargo zigbuild --release --locked --target "${TARGET}"
    - mkdir -p dist
    - |
      if [ "${TARGET}" = "x86_64-pc-windows-gnu" ]; then
        cp "target/${TARGET}/release/${BIN_NAME}.exe" "dist/${ARTIFACT}.exe"
        (cd dist && zip -9 "${ARTIFACT}.zip" "${ARTIFACT}.exe")
        rm "dist/${ARTIFACT}.exe"
      else
        cp "target/${TARGET}/release/${BIN_NAME}" "dist/${ARTIFACT}"
        chmod +x "dist/${ARTIFACT}"
        (cd dist && tar czf "${ARTIFACT}.tar.gz" "${ARTIFACT}")
        rm "dist/${ARTIFACT}"
      fi
    - (cd dist && sha256sum * > "${ARTIFACT}.sha256")
    - ls -la dist/
  artifacts:
    name: "${ARTIFACT}"
    paths:
      - dist/${ARTIFACT}*
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:linux-x86_64:
  extends: .build
  variables:
    TARGET: "x86_64-unknown-linux-gnu"
    BIN_NAME: "jcode"
    ARTIFACT: "jcode-linux-x86_64"

build:linux-aarch64:
  extends: .build
  variables:
    TARGET: "aarch64-unknown-linux-gnu"
    BIN_NAME: "jcode"
    ARTIFACT: "jcode-linux-aarch64"

build:macos-aarch64:
  extends: .build
  variables:
    TARGET: "aarch64-apple-darwin"
    BIN_NAME: "jcode"
    ARTIFACT: "jcode-macos-aarch64"
    # macOS SDK is fetched into the cargo-zigbuild image at runtime via
    # `cargo zigbuild`'s built-in Apple SDK bootstrap. No manual osxcross.

build:windows-x86_64:
  extends: .build
  variables:
    TARGET: "x86_64-pc-windows-gnu"
    BIN_NAME: "jcode"
    ARTIFACT: "jcode-windows-x86_64"

# --- SBOM (Syft, CycloneDX + SPDX) ---

sbom:
  stage: sbom
  image: ${SYFT_IMAGE}
  needs:
    - build:linux-x86_64
    - build:linux-aarch64
    - build:macos-aarch64
    - build:windows-x86_64
  script:
    - echo "=== Syft SBOM (CycloneDX + SPDX JSON) over cargo workspace ==="
    - mkdir -p dist
    - syft dir:. -o cyclonedx-json=dist/jcode-${CI_COMMIT_SHORT_SHA}.cdx.json
    - syft dir:. -o spdx-json=dist/jcode-${CI_COMMIT_SHORT_SHA}.spdx.json
    - ls -la dist/
  artifacts:
    paths:
      - dist/jcode-*.cdx.json
      - dist/jcode-*.spdx.json
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- Notation/AKV signing ---
#
# Detached-signature mode: notation signs each release artifact (the four
# binary tarballs/zip) plus the SBOM. Output lands in dist/*.sig.
# Requires the standard notation-signing K8s secret mounted by the runner
# (or the AKV plugin configured via NOTATION_KEY_NAME env).

sign:
  stage: sign
  image: ${NOTATION_IMAGE}
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:macos-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
    - job: sbom
      artifacts: true
  variables:
    NOTATION_KEY_NAME: "${NOTATION_KEY_NAME:-akv-notation-jcode}"
  script:
    - echo "=== Notation/AKV detached signing ==="
    - cd dist
    - |
      for f in jcode-linux-x86_64.tar.gz \
               jcode-linux-aarch64.tar.gz \
               jcode-macos-aarch64.tar.gz \
               jcode-windows-x86_64.zip \
               jcode-${CI_COMMIT_SHORT_SHA}.cdx.json \
               jcode-${CI_COMMIT_SHORT_SHA}.spdx.json; do
        if [ -f "${f}" ]; then
          echo "--- signing ${f} ---"
          notation sign --key "${NOTATION_KEY_NAME}" --signature-format jws \
            --output "${f}.sig" --detached "${f}"
        else
          echo "WARN: ${f} missing — skipping"
        fi
      done
    - ls -la
  artifacts:
    paths:
      - dist/*.sig
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- Harbor publish via ORAS ---
#
# Pushes the full release bundle (binaries + SBOM + signatures) as a
# single OCI artifact under harbor.focuscell.org/droidopsinc/jcode:<tag>.

publish:
  stage: publish
  image: ${ORAS_IMAGE}
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:macos-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
    - job: sbom
      artifacts: true
    - job: sign
      artifacts: true
  variables:
    HARBOR_REPO: "${IMAGE_REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
  script:
    - echo "=== ORAS push -> ${HARBOR_REPO} ==="
    - cd dist
    - export TAG="${CI_COMMIT_TAG:-sha-${CI_COMMIT_SHORT_SHA}}"
    - |
      if [ -z "${HARBOR_USER:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
        echo "ERROR: HARBOR_USER / HARBOR_PASSWORD CI variables required"
        exit 1
      fi
    - oras login "${IMAGE_REGISTRY}" -u "${HARBOR_USER}" -p "${HARBOR_PASSWORD}"
    - |
      ORAS_FILES=(
        "jcode-linux-x86_64.tar.gz:application/gzip"
        "jcode-linux-aarch64.tar.gz:application/gzip"
        "jcode-macos-aarch64.tar.gz:application/gzip"
        "jcode-windows-x86_64.zip:application/zip"
        "jcode-${CI_COMMIT_SHORT_SHA}.cdx.json:application/vnd.cyclonedx+json"
        "jcode-${CI_COMMIT_SHORT_SHA}.spdx.json:application/spdx+json"
      )
      for s in *.sig; do
        [ -f "${s}" ] && ORAS_FILES+=("${s}:application/vnd.cncf.notary.signature")
      done
      oras push "${HARBOR_REPO}:${TAG}" \
        --artifact-type application/vnd.droidops.jcode.bundle.v1+json \
        --annotation "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --annotation "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --annotation "org.opencontainers.image.version=${TAG}" \
        "${ORAS_FILES[@]}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- Trivy filesystem scan-gate ---

scan:
  stage: scan
  image: ${TRIVY_IMAGE}
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: sbom
      artifacts: true
  script:
    - echo "=== Trivy filesystem scan ==="
    - cd dist
    # Scan the unpacked Linux x86_64 binary (representative artifact) plus
    # the SBOM via Trivy's CycloneDX SBOM mode.
    - mkdir -p _scan && tar xzf jcode-linux-x86_64.tar.gz -C _scan
    - trivy fs --no-progress --exit-code 1 --severity HIGH,CRITICAL --format json --output trivy-fs.json _scan/
    - trivy sbom --no-progress --exit-code 1 --severity HIGH,CRITICAL --format json --output trivy-sbom.json "jcode-${CI_COMMIT_SHORT_SHA}.cdx.json"
    - rm -rf _scan
  artifacts:
    paths:
      - dist/trivy-*.json
    when: always
    expire_in: 30 days
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- OPA / Conftest policy gate ---
#
# Conftest evaluates `policy/release.rego` against `release-bundle.json`
# (the manifest of artifacts about to be released). See policy/release.rego
# for the rules that are enforced.

policy:release:
  extends: .policy:gate
  needs:
    - job: build:linux-x86_64
    - job: build:linux-aarch64
    - job: build:macos-aarch64
    - job: build:windows-x86_64
    - job: sbom
    - job: sign
  before_script:
    - mkdir -p dist
    - |
      cat > dist/release-bundle.json <<EOF
      {
        "tag": "${CI_COMMIT_TAG:-sha-${CI_COMMIT_SHORT_SHA}}",
        "commit": "${CI_COMMIT_SHA}",
        "artifacts": [
          {"name": "jcode-linux-x86_64.tar.gz", "kind": "binary", "os": "linux", "arch": "x86_64"},
          {"name": "jcode-linux-aarch64.tar.gz", "kind": "binary", "os": "linux", "arch": "aarch64"},
          {"name": "jcode-macos-aarch64.tar.gz", "kind": "binary", "os": "macos", "arch": "aarch64"},
          {"name": "jcode-windows-x86_64.zip", "kind": "binary", "os": "windows", "arch": "x86_64"},
          {"name": "jcode-${CI_COMMIT_SHORT_SHA}.cdx.json", "kind": "sbom", "format": "cyclonedx"},
          {"name": "jcode-${CI_COMMIT_SHORT_SHA}.spdx.json", "kind": "sbom", "format": "spdx"}
        ]
      }
      EOF
  variables:
    POLICY_PATHS: "dist/release-bundle.json"
    POLICY_NAMESPACE: "release"
    POLICY_FAIL_ON: "deny"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- Provenance attestation ---
#
# Emits an in-toto-shaped provenance statement and signs it with notation.

attest:
  stage: attest
  image: ${NOTATION_IMAGE}
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:macos-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
    - job: sbom
      artifacts: true
  variables:
    NOTATION_KEY_NAME: "${NOTATION_KEY_NAME:-akv-notation-jcode}"
  script:
    - echo "=== Provenance attestation ==="
    - cd dist
    - |
      LX=$(sha256sum jcode-linux-x86_64.tar.gz | cut -d' ' -f1)
      LA=$(sha256sum jcode-linux-aarch64.tar.gz | cut -d' ' -f1)
      MA=$(sha256sum jcode-macos-aarch64.tar.gz | cut -d' ' -f1)
      WX=$(sha256sum jcode-windows-x86_64.zip | cut -d' ' -f1)
      cat > provenance.json <<EOF
      {
        "_type": "https://in-toto.io/Statement/v1",
        "predicateType": "https://slsa.dev/provenance/v1",
        "subject": [
          {"name": "jcode-linux-x86_64.tar.gz", "digest": {"sha256": "${LX}"}},
          {"name": "jcode-linux-aarch64.tar.gz", "digest": {"sha256": "${LA}"}},
          {"name": "jcode-macos-aarch64.tar.gz", "digest": {"sha256": "${MA}"}},
          {"name": "jcode-windows-x86_64.zip", "digest": {"sha256": "${WX}"}}
        ],
        "predicate": {
          "buildDefinition": {
            "buildType": "https://gitlab.com/gitlab-org/gitlab/-/blob/master/doc/ci/yaml/index.md",
            "externalParameters": {
              "repository": "${CI_PROJECT_URL}",
              "ref": "${CI_COMMIT_REF_NAME}",
              "commit": "${CI_COMMIT_SHA}"
            }
          },
          "runDetails": {
            "builder": {"id": "${CI_SERVER_URL}/${CI_PROJECT_PATH}"},
            "metadata": {
              "invocationId": "${CI_PIPELINE_ID}",
              "startedOn": "${CI_PIPELINE_CREATED_AT}"
            }
          }
        }
      }
      EOF
    - notation sign --key "${NOTATION_KEY_NAME}" --signature-format jws --output provenance.json.sig --detached provenance.json
    - ls -la
  artifacts:
    paths:
      - dist/provenance.json
      - dist/provenance.json.sig
    expire_in: 365 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- GitLab Release ---
#
# Tag-only. Uses the launch-sequence release-create template; we override
# the description and asset list to point at our four signed binaries +
# SBOM + provenance bundle.

release:
  extends: .release:create
  stage: release-create
  needs:
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-aarch64
      artifacts: true
    - job: build:macos-aarch64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
    - job: sbom
      artifacts: true
    - job: sign
      artifacts: true
    - job: attest
      artifacts: true
    - job: publish
    - job: scan
    - job: policy:release
  variables:
    RELEASE_TAG_FORMAT: "${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*-droidops/'
    - if: '$CI_COMMIT_TAG =~ /^v.*-dops/'

# --- Daily upstream-sync ---
#
# Schedule with UPSTREAM_SYNC=true to fast-forward `master` from
# upstream/master and push back to origin. After a successful advance,
# invokes scripts/sync-feature-branches.sh to rebase long-lived feature
# branches against the new tip (DroidOpsInc/jcode#3).

upstream-sync:
  stage: upstream-sync
  image: ${IMAGE_REGISTRY}/dockerhub-proxy/alpine/git:v2.52.0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $UPSTREAM_SYNC == "true"'
  before_script:
    - apk add --no-cache curl bash
  script:
    - git config user.email "ci@droidopsinc.dev"
    - git config user.name "DroidOps CI (jcode upstream sync)"
    - git remote add upstream "${UPSTREAM_URL}" || git remote set-url upstream "${UPSTREAM_URL}"
    - git fetch upstream "${UPSTREAM_BRANCH}"
    - git fetch upstream --tags
    - git checkout "${UPSTREAM_BRANCH}"
    - |
      if ! git merge --ff-only "upstream/${UPSTREAM_BRANCH}"; then
        echo "ERROR: master has diverged from upstream/${UPSTREAM_BRANCH}."
        echo "Manual reconciliation required."
        exit 1
      fi
    - |
      if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
        echo "ERROR: UPSTREAM_SYNC_TOKEN is not set."
        echo "Create a project access token with write_repository scope and store it as a masked CI variable."
        exit 1
      fi
    - |
      git push "https://oauth2:${UPSTREAM_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "${UPSTREAM_BRANCH}" --tags
    # Trigger feature-branch rebase pass after a successful upstream advance.
    # See scripts/sync-feature-branches.sh and DroidOpsInc/jcode#3.
    - |
      if [ -x scripts/sync-feature-branches.sh ]; then
        echo "=== Rebasing long-lived feature branches against upstream ==="
        bash scripts/sync-feature-branches.sh || echo "WARN: feature-branch rebase pass returned non-zero; conflicts will surface as labeled MRs"
      fi
  interruptible: true
