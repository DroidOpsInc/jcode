# DroidOpsInc/jcode CI
#
# Vendored fork of github.com/1jehuang/jcode (MIT). See DROIDOPS.md.
#
# v0 scope: upstream-sync only.
#   Build/test/release uses upstream's existing GitHub Actions for now.
#   Launch-sequence integration is a follow-up — see DroidOpsInc/hypercraft
#   epic for the harness-engine adapter milestone.

stages:
  - upstream-sync

variables:
  UPSTREAM_URL: "https://github.com/1jehuang/jcode.git"
  UPSTREAM_BRANCH: "master"

# Daily fast-forward of master from upstream.
# Schedule with: variable UPSTREAM_SYNC=true and a daily cadence.
# Requires CI variable UPSTREAM_SYNC_TOKEN (project access token, write_repository scope).
upstream-sync:
  stage: upstream-sync
  image: alpine/git:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $UPSTREAM_SYNC == "true"'
  script:
    - git config user.email "ci@droidopsinc.dev"
    - git config user.name "DroidOps CI (jcode upstream sync)"
    - git remote add upstream "${UPSTREAM_URL}" || git remote set-url upstream "${UPSTREAM_URL}"
    - git fetch upstream "${UPSTREAM_BRANCH}"
    - git fetch upstream --tags
    - git checkout -B "${UPSTREAM_BRANCH}" "refs/remotes/origin/${UPSTREAM_BRANCH}"
    - |
      if ! git merge --ff-only "upstream/${UPSTREAM_BRANCH}"; then
        echo "ERROR: master has diverged from upstream/${UPSTREAM_BRANCH}."
        echo "Manual reconciliation required."
        exit 1
      fi
    - |
      if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
        echo "ERROR: UPSTREAM_SYNC_TOKEN is not set."
        echo "Create a project access token with write_repository scope and store it as a masked CI variable."
        exit 1
      fi
    - |
      git push "https://oauth2:${UPSTREAM_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "${UPSTREAM_BRANCH}" --tags
  interruptible: true
