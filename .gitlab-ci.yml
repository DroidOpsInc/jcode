# DroidOpsInc/jcode CI
#
# Vendored fork of github.com/1jehuang/jcode (MIT). See DROIDOPS.md.
#
# v0 scope: upstream-sync only.
#   Build/test/release uses upstream's existing GitHub Actions for now.
#   Launch-sequence integration is a follow-up — see DroidOpsInc/hypercraft
#   epic for the harness-engine adapter milestone.

stages:
  - upstream-sync

variables:
  UPSTREAM_URL: "https://github.com/1jehuang/jcode.git"
  UPSTREAM_BRANCH: "master"

# Daily merge of upstream into master. The fork carries local commits (CI, DROIDOPS.md),
# so a fast-forward is impossible; history is merged, never rewritten or rebased.
# On a merge conflict the job aborts the merge, opens (or reuses) an issue and fails.
# Schedule with: variable UPSTREAM_SYNC=true and a daily cadence.
# Requires CI variable UPSTREAM_SYNC_TOKEN (project access token, write_repository scope;
# add api scope so the conflict issue can be opened).
upstream-sync:
  stage: upstream-sync
  image: alpine/git:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $UPSTREAM_SYNC == "true"'
  script:
    - |
      if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
        echo "ERROR: UPSTREAM_SYNC_TOKEN is not set."
        echo "Create a project access token with write_repository scope and store it as a masked CI variable."
        exit 1
      fi
    - git config user.email "ci@droidopsinc.dev"
    - git config user.name "DroidOps CI (jcode upstream sync)"
    - git remote add upstream "${UPSTREAM_URL}" || git remote set-url upstream "${UPSTREAM_URL}"
    - git fetch upstream "${UPSTREAM_BRANCH}"
    - git fetch upstream --tags
    - git checkout -B "${UPSTREAM_BRANCH}" "refs/remotes/origin/${UPSTREAM_BRANCH}"
    - |
      if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
        git merge --abort || true
        TITLE="upstream-sync: merge conflict with upstream/${UPSTREAM_BRANCH}"
        API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues"
        EXISTING="$(wget -q -O - --header "PRIVATE-TOKEN: ${UPSTREAM_SYNC_TOKEN}" "${API}?state=opened&search=upstream-sync%3A+merge+conflict" || true)"
        if echo "$EXISTING" | grep -q "merge conflict with upstream"; then
          echo "An open conflict issue already exists."
        else
          wget -q -O /dev/null --header "PRIVATE-TOKEN: ${UPSTREAM_SYNC_TOKEN}" \
            --post-data "title=${TITLE}&description=Scheduled sync pipeline ${CI_PIPELINE_URL} could not merge upstream/${UPSTREAM_BRANCH} into ${CI_COMMIT_BRANCH:-$UPSTREAM_BRANCH}. Resolve the conflict by merging upstream locally and pushing." \
            "${API}" || echo "WARNING: could not open the conflict issue (token needs api scope)."
        fi
        echo "ERROR: merge conflict with upstream/${UPSTREAM_BRANCH}. Manual resolution required."
        exit 1
      fi
    - |
      git push "https://oauth2:${UPSTREAM_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "${UPSTREAM_BRANCH}" --tags
  interruptible: true
