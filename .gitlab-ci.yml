# DroidOpsInc/jcode CI
#
# Vendored fork of github.com/1jehuang/jcode (MIT). See DROIDOPS.md.
#
# Scope: upstream-sync, upstream-merge-check, and a Rust compile+test gate (rust-check).
#   Release still uses upstream's GitHub Actions.
#   Launch-sequence integration is a follow-up — see DroidOpsInc/hypercraft
#   epic for the harness-engine adapter milestone.

stages:
  - check
  - upstream-sync

variables:
  UPSTREAM_URL: "https://github.com/1jehuang/jcode.git"
  UPSTREAM_BRANCH: "master"
  IMAGE_REGISTRY: "harbor.focuscell.org"

# Daily merge of upstream into master. The fork carries local commits (CI, DROIDOPS.md),
# so a fast-forward is impossible; history is merged, never rewritten or rebased.
# On a merge conflict the job aborts the merge, opens (or reuses) an issue and fails.
# Schedule with: variable UPSTREAM_SYNC=true and a daily cadence.
# Requires CI variable UPSTREAM_SYNC_TOKEN: project access token "upstream-sync"
# (Maintainer, scopes api + write_repository; api is needed to open the conflict issue).
upstream-sync:
  stage: upstream-sync
  image: alpine/git:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $UPSTREAM_SYNC == "true"'
  script:
    - |
      if [ -z "$UPSTREAM_SYNC_TOKEN" ]; then
        echo "ERROR: UPSTREAM_SYNC_TOKEN is not set."
        echo "Create a project access token with write_repository scope and store it as a masked CI variable."
        exit 1
      fi
    - git config user.email "ci@droidopsinc.dev"
    - git config user.name "DroidOps CI (jcode upstream sync)"
    - git remote add upstream "${UPSTREAM_URL}" || git remote set-url upstream "${UPSTREAM_URL}"
    - git fetch upstream "${UPSTREAM_BRANCH}"
    - git fetch upstream --tags
    - git checkout -B "${UPSTREAM_BRANCH}" "refs/remotes/origin/${UPSTREAM_BRANCH}"
    - |
      if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
        git merge --abort || true
        TITLE="upstream-sync: merge conflict with upstream/${UPSTREAM_BRANCH}"
        API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues"
        EXISTING="$(wget -q -O - --header "PRIVATE-TOKEN: ${UPSTREAM_SYNC_TOKEN}" "${API}?state=opened&search=upstream-sync%3A+merge+conflict" || true)"
        if echo "$EXISTING" | grep -q "merge conflict with upstream"; then
          echo "An open conflict issue already exists."
        else
          wget -q -O /dev/null --header "PRIVATE-TOKEN: ${UPSTREAM_SYNC_TOKEN}" \
            --post-data "title=${TITLE}&description=Scheduled sync pipeline ${CI_PIPELINE_URL} could not merge upstream/${UPSTREAM_BRANCH} into ${CI_COMMIT_BRANCH:-$UPSTREAM_BRANCH}. Resolve the conflict by merging upstream locally and pushing." \
            "${API}" || echo "WARNING: could not open the conflict issue (token needs api scope)."
        fi
        echo "ERROR: merge conflict with upstream/${UPSTREAM_BRANCH}. Manual resolution required."
        exit 1
      fi
    - |
      git push "https://oauth2:${UPSTREAM_SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        "${UPSTREAM_BRANCH}" --tags
  interruptible: true

# Gate: a trial merge of upstream into the MR head, so a change that will conflict
# with the next daily upstream-sync (for example edits to files upstream moved or
# deleted) is visible on the MR before it merges. Warning only (allow_failure):
# the fork is expected to carry local divergence, and upstream churn must not block
# unrelated MRs; a red-with-warning job means "resolve the merge soon".
upstream-merge-check:
  stage: check
  image: alpine/git:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  script:
    - git config user.email "ci@droidopsinc.dev"
    - git config user.name "DroidOps CI (jcode merge check)"
    - git remote add upstream "${UPSTREAM_URL}" || git remote set-url upstream "${UPSTREAM_URL}"
    - git fetch --quiet upstream "${UPSTREAM_BRANCH}"
    - |
      if git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
        git merge --abort || true
        echo "OK: upstream/${UPSTREAM_BRANCH} merges cleanly into this MR."
      else
        echo "CONFLICTS with upstream/${UPSTREAM_BRANCH}:"
        git diff --name-only --diff-filter=U
        git merge --abort || true
        echo "Resolve by merging upstream into the default branch (see upstream-sync)."
        exit 1
      fi
  interruptible: true

# Compile + test gate for the fork's Rust (including the opt-in telemetry port in
# crates/jcode-telemetry-core). Runs on master pushes and MRs, never on the
# scheduled upstream-sync pipeline. CI builds are the only place this is compiled.
rust-check:
  stage: check
  image: ${IMAGE_REGISTRY}/dockerhub-proxy/library/rust:1-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    JCODE_CI: "1"
    CARGO_HOME: "${CI_PROJECT_DIR}/.cargo-home"
    CARGO_TARGET_DIR: "${CI_PROJECT_DIR}/target"
    # Disable the local -Zthreads rustc wrapper from .cargo/config.toml.
    CARGO_BUILD_RUSTC_WRAPPER: ""
    CARGO_INCREMENTAL: "0"
    CARGO_TERM_COLOR: never
    # Runner disk is small: no debuginfo, and the cache keeps only the registry.
    CARGO_PROFILE_DEV_DEBUG: "0"
    CARGO_PROFILE_TEST_DEBUG: "0"
  cache:
    key:
      files: [Cargo.lock]
      prefix: rust-check
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
  timeout: 1h
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake clang libclang-dev pkg-config libssl-dev protobuf-compiler >/dev/null
    - rustc --version && cargo --version
  script:
    - df -h . | tail -1
    - cargo check --locked --workspace
    - rm -rf target/debug/incremental
    - df -h . | tail -1
    - cargo test --locked -p jcode-telemetry-core -p jcode-app-core
  interruptible: true
